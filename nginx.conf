# NOTE: this file is a TEMPLATE rendered at container start by
# /entrypoint.sh (see deploy/entrypoint.sh):
#   /etc/nginx/templates/nginx.conf.template -> /etc/nginx/nginx.conf
#
# It is a COMPLETE nginx configuration (main + events + http contexts), not a
# conf.d snippet. Reason: the Alpine nginx package includes
# /etc/nginx/conf.d/*.conf in the ROOT context (http snippets live in
# /etc/nginx/http.d/), so dropping a bare `server { ... }` block into conf.d
# fails with: "server" directive is not allowed here. Owning the whole file
# removes that distro-layout dependency entirely.
#
# The ONLY placeholder is the backend-upstream host token (double underscore
# around BACKEND_HOST) — the entrypoint substitutes it from the $BACKEND_HOST
# environment variable with sed (no gettext/envsubst needed). Real nginx
# variables ($host, $uri, $http_upgrade, ...) are written as usual and are
# left untouched by the renderer.

user nginx;
worker_processes auto;
pid /run/nginx.pid;

error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  server_tokens off;
  client_max_body_size 25m;

  # Container-friendly logging (visible via `docker logs` / pod logs).
  access_log /dev/stdout;

  server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
      proxy_pass http://__BACKEND_HOST__:4000/api/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io/ {
      proxy_pass http://__BACKEND_HOST__:4000/socket.io/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    location / {
      try_files $uri /index.html;
    }
  }
}
