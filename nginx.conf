# NOTE: this file is an envsubst TEMPLATE inside the image
# (copied to /etc/nginx/templates/default.conf.template and rendered to
# /etc/nginx/conf.d/default.conf at container start by the official
# nginx image helper).
# ${BACKEND_HOST} is the ONLY variable that gets substituted — nginx
# variables like $host, $uri, $http_upgrade are left untouched.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Container-friendly logging (visible via `docker logs` / pod logs).
  access_log /dev/stdout;
  error_log /dev/stderr warn;

  location /api/ {
    proxy_pass http://${BACKEND_HOST}:4000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /socket.io/ {
    proxy_pass http://${BACKEND_HOST}:4000/socket.io/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location / {
    try_files $uri /index.html;
  }
}
