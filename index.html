<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Цвет в тон верхней части градиента оболочки: статус-бар мобильного
         браузера и PWA на Android сливается с приложением вместо чёрной
         полосы. На iOS в standalone статус-баром управляет мета-тег
         apple-mobile-web-app-status-bar-style ниже. -->
    <meta name="theme-color" content="#141633" />
    <!-- PWA: «Добавить на экран Домой» на iOS/Android даёт вид полноценного приложения -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- Прозрачный статус-бар (black-translucent): в PWA градиент приложения
         заходит ПОД статус-бар — сверху нет чёрной полосы, а сам контент
         отстоит от края экрана на env(safe-area-inset-top) (см. TopBar,
         SplashPage). Обратная сторона translucent — риск чёрной полосы
         ВНИЗУ экрана («chin» WebKit): она появляется, когда высоты html/body
         заданы в % или dvh — iOS смещает полотно под статус-бар, не
         компенсируя смещение в процентных высотах. Поэтому в standalone-
         режиме index.css переключает html/body/#root и телефонную рамку на
         100vh (физическая высота экрана): фон дотягивается до последнего
         ряда пикселей, и внизу полосы нет. ВАЖНО: apple-mobile-web-app-*
         мета-теги iOS «запекает» в момент добавления значка на домашний
         экран — уже установленное приложение надо удалить и добавить
         заново, чтобы изменение подхватилось. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DSU Event" />
    <script>
      // iOS не поддерживает медиа-запрос display-mode, но отдаёт флаг
      // navigator.standalone. Вешаем класс на <html> ДО первой отрисовки,
      // чтобы index.css сразу переключил высоты на 100vh в PWA-режиме
      // (страховка от чёрной полосы внизу экрана при black-translucent).
      if (window.navigator.standalone) {
        document.documentElement.classList.add("pwa-standalone-ios");
      }
    </script>
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Фавиконка — знак логотипа DSU Event (трофей с золотой звездой);
         в крупных контекстах (тайлы, шорткаты) браузер возьмёт png-логотип
         из manifest. Полные версии — public/logo.svg. -->

      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Cdefs%3E%3ClinearGradient%20id='b'%20x1='0'%20y1='0'%20x2='1'%20y2='1'%3E%3Cstop%20offset='0'%20stop-color='%236366f1'/%3E%3Cstop%20offset='.55'%20stop-color='%238b5cf6'/%3E%3Cstop%20offset='1'%20stop-color='%2338bdf8'/%3E%3C/linearGradient%3E%3CradialGradient%20id='g'%20cx='.2'%20cy='.05'%20r='1'%3E%3Cstop%20offset='0'%20stop-color='%236366f1'%20stop-opacity='.55'/%3E%3Cstop%20offset='1'%20stop-color='%236366f1'%20stop-opacity='0'/%3E%3C/radialGradient%3E%3C/defs%3E%3Crect%20width='64'%20height='64'%20fill='%230a0c1e'/%3E%3Crect%20width='64'%20height='64'%20fill='url(%23g)'/%3E%3Ccircle%20cx='32'%20cy='28.5'%20r='22'%20fill='none'%20stroke='%23ffffff'%20stroke-opacity='.12'%20stroke-width='1'%20stroke-dasharray='1.5%206'%20stroke-linecap='round'/%3E%3Ccircle%20cx='52.5'%20cy='13.5'%20r='1.6'%20fill='%237dd3fc'/%3E%3Ccircle%20cx='12.5'%20cy='15'%20r='1.2'%20fill='%23a78bfa'%20fill-opacity='.9'/%3E%3Cg%20transform='translate(32%2030)'%3E%3Ccircle%20r='18'%20fill='white'%20fill-opacity='.06'/%3E%3Cpath%20d='M%20-8%20-10%20L%20-8%202%20C%20-8%207%20-4%2010%200%2010%20C%204%2010%208%207%208%202%20L%208%20-10%20Z'%20fill='white'%20fill-opacity='.95'/%3E%3Cpath%20d='M%20-8%20-6%20C%20-12%20-6%20-14%20-2%20-10%202'%20fill='none'%20stroke='white'%20stroke-opacity='.9'%20stroke-width='1.7'%20stroke-linecap='round'/%3E%3Cpath%20d='M%208%20-6%20C%2012%20-6%2014%20-2%2010%202'%20fill='none'%20stroke='white'%20stroke-opacity='.9'%20stroke-width='1.7'%20stroke-linecap='round'/%3E%3Crect%20x='-2'%20y='10'%20width='4'%20height='6'%20rx='1'%20fill='white'/%3E%3Crect%20x='-7'%20y='16'%20width='14'%20height='4'%20rx='1.2'%20fill='white'/%3E%3Cpath%20d='M%200%20-5%20L%200.9%20-3%20L%202.8%20-2.8%20L%201.3%20-1.6%20L%201.7%200.2%20L%200%20-0.8%20L%20-1.7%200.2%20L%20-1.3%20-1.6%20L%20-2.8%20-2.8%20L%20-0.9%20-3%20Z'%20fill='%236366f1'/%3E%3C/g%3E%3C/svg%3E"
    />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <title>DSU Event — События в реальном времени</title>
    <meta name="description" content="DSU Event — платформа live-событий и голосований в реальном времени." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
