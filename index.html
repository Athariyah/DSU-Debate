<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Цвет в тон верхней части градиента оболочки: статус-бар мобильного
         браузера и PWA на Android сливается с приложением вместо чёрной
         полосы. На iOS в standalone статус-баром управляет мета-тег
         apple-mobile-web-app-status-bar-style ниже. -->
    <meta name="theme-color" content="#141633" />
    <!-- PWA: «Добавить на экран Домой» на iOS/Android даёт вид полноценного приложения -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- Прозрачный статус-бар (black-translucent): в PWA градиент приложения
         заходит ПОД статус-бар — сверху нет чёрной полосы, а сам контент
         отстоит от края экрана на env(safe-area-inset-top) (см. TopBar,
         SplashPage). Обратная сторона translucent — риск чёрной полосы
         ВНИЗУ экрана («chin» WebKit): она появляется, когда высоты html/body
         заданы в % или dvh — iOS смещает полотно под статус-бар, не
         компенсируя смещение в процентных высотах. Поэтому в standalone-
         режиме index.css переключает html/body/#root и телефонную рамку на
         100vh (физическая высота экрана): фон дотягивается до последнего
         ряда пикселей, и внизу полосы нет. ВАЖНО: apple-mobile-web-app-*
         мета-теги iOS «запекает» в момент добавления значка на домашний
         экран — уже установленное приложение надо удалить и добавить
         заново, чтобы изменение подхватилось. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DSU Debate" />
    <script>
      // iOS не поддерживает медиа-запрос display-mode, но отдаёт флаг
      // navigator.standalone. Вешаем класс на <html> ДО первой отрисовки,
      // чтобы index.css сразу переключил высоты на 100vh в PWA-режиме
      // (страховка от чёрной полосы внизу экрана при black-translucent).
      if (window.navigator.standalone) {
        document.documentElement.classList.add("pwa-standalone-ios");
      }
    </script>
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%2064%2064'%3E%3Cdefs%3E%3ClinearGradient%20id%3D'g'%20x1%3D'0'%20y1%3D'0'%20x2%3D'1'%20y2%3D'1'%3E%3Cstop%20offset%3D'0'%20stop-color%3D'%236366f1'%2F%3E%3Cstop%20offset%3D'0.55'%20stop-color%3D'%238b5cf6'%2F%3E%3Cstop%20offset%3D'1'%20stop-color%3D'%2338bdf8'%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Crect%20width%3D'64'%20height%3D'64'%20rx%3D'14'%20fill%3D'url(%23g)'%2F%3E%3Cpath%20d%3D'M19%2016h14a7%207%200%200%201%207%207v8a7%207%200%200%201-7%207h-6l-7%206v-6h-1a7%207%200%200%201-7-7v-8a7%207%200%200%201%207-7z'%20fill%3D'%23ffffff'%2F%3E%3Cpath%20d%3D'M36%2028h10a6%206%200%200%201%206%206v6a6%206%200%200%201-6%206h-1v5l-6-5h-3a6%206%200%200%201-6-6v-6a6%206%200%200%201%206-6z'%20fill%3D'%23ffffff'%20opacity%3D'0.62'%2F%3E%3C%2Fsvg%3E" />
    <title>DSU Debate — Твой голос решает</title>
    <meta name="description" content="DSU Debate — платформа live-голосований на дебатах в реальном времени." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
