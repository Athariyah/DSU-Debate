; Supervisor config for the all-in-one container.
; PID 1 = supervisord; it manages the built-in stack and nginx and
; reaps/restarts them properly.

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
user=root
pidfile=/var/run/supervisord.pid
logfile=/dev/null
loglevel=info
minfds=4096
minprocs=200

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

; Built-in PostgreSQL + Node backend.
; In RUN_MODE=proxy the script exits 0 immediately (clean "exited" state).
[program:embedded]
command=/app/embedded.sh
priority=10
autostart=true
autorestart=unexpected
startsecs=1
startretries=5
stopsignal=TERM
stopwaitsecs=20
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

; nginx: serves the React SPA and proxies /api + /socket.io.
[program:nginx]
command=/usr/sbin/nginx -g 'daemon off;'
priority=20
autostart=true
autorestart=true
startsecs=1
startretries=5
stopsignal=QUIT
stopwaitsecs=20
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
