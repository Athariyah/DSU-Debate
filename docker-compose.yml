services:
  # Single all-in-one container: nginx (React SPA) + Node backend + PostgreSQL.
  # The same image is what gets deployed to one-container platforms (K8s).
  app:
    build:
      context: .
      args:
        VITE_API_URL: /api
        VITE_SOCKET_URL: ""
    container_name: dsu-debate
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 4000
      # Either a full connection string or the separate DB_* variables below.
      # Empty DB_* values fall back to the built-in PostgreSQL of the image.
      DATABASE_URL: ${DATABASE_URL:-postgresql://dsu:dsu@127.0.0.1:5432/dsu_debate}
      DB_HOST: ${DB_HOST:-}
      DB_PORT: ${DB_PORT:-}
      DB_NAME: ${DB_NAME:-}
      DB_USER: ${DB_USER:-}
      DB_PASSWORD: ${DB_PASSWORD:-}
      DB_SSLMODE: ${DB_SSLMODE:-}
      DB_POOL_MAX: ${DB_POOL_MAX:-20}
      # Set to false to skip the built-in PostgreSQL when using an external DB
      # (for example the Amvera managed cluster).
      EMBEDDED_POSTGRES: ${EMBEDDED_POSTGRES:-true}
      JWT_SECRET: ${JWT_SECRET:-change-this-development-secret}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@dsu.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ChangeMe123!}
      ALLOW_ADMIN_REGISTRATION: "false"
      ADMIN_REGISTRATION_KEY: ${ADMIN_REGISTRATION_KEY:-}
    ports:
      - "3000:80"
    volumes:
      # Keeps PostgreSQL data across container rebuilds.
      - dsu-debate-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/api/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # Standalone database for backend-only development
  # (`docker compose --profile db up -d db`), see README.
  db:
    profiles: ["db"]
    image: postgres:16-alpine
    container_name: dsu-debate-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: dsu_debate
      POSTGRES_USER: dsu
      POSTGRES_PASSWORD: dsu
    ports:
      - "5432:5432"
    volumes:
      - dsu-debate-dev-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dsu -d dsu_debate"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  dsu-debate-postgres:
  dsu-debate-dev-postgres:
