services:
  db:
    image: postgres:16-alpine
    container_name: dsu-debate-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: dsu_debate
      POSTGRES_USER: dsu
      POSTGRES_PASSWORD: dsu
    ports:
      - "5432:5432"
    volumes:
      - dsu-debate-postgres:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dsu -d dsu_debate"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  dsu-debate-postgres:
